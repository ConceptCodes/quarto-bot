[project]
name = "quarto-bot"
version = "0.1.0"
description = "Training stack for a SO-Arm101 robot that can play Quarto via simulation and RL."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Quarto Bot" }]
dependencies = [
    "quarto-engine",
    "quarto-vision",
    "quarto-driver",
    "quarto-sim",
    "quarto-brain",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quarto-engine = { workspace = true }
quarto-vision = { workspace = true }
quarto-driver = { workspace = true }
quarto-sim = { workspace = true }
quarto-brain = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarto_bot"]
