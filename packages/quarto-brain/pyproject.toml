[project]
name = "quarto-brain"
version = "0.1.0"
description = "Strategy agent for Quarto"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "gymnasium",
    "quarto-engine",
]

[tool.uv.sources]
quarto-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarto_brain"]
