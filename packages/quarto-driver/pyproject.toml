[project]
name = "quarto-driver"
version = "0.1.0"
description = "Hardware interface for SO-Arm101 and Camera"
requires-python = ">=3.10"
dependencies = [
    "pyserial",
    "opencv-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarto_driver"]
