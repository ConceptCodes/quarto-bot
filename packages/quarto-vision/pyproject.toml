[project]
name = "quarto-vision"
version = "0.1.0"
description = "Computer Vision for Quarto Bot"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "quarto-driver",
]

[tool.uv.sources]
quarto-driver = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarto_vision"]
