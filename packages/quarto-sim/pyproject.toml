[project]
name = "quarto-sim"
version = "0.1.0"
description = "Simulation and RL for Quarto Bot"
requires-python = ">=3.10"
dependencies = [
    "mujoco",
    "gymnasium[other]",
    "pufferlib>=3.0.0",
    "stable-baselines3[extra]",
    "shimmy<2.0",
    "pyyaml",
    "numpy",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarto_sim"]
